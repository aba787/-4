
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>توثيق المؤهلات - مُمكّن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        font-family: "Cairo", sans-serif;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #f8fdf9 0%, #e8f5e8 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .page-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .page-header h1 {
        color: var(--primary-color, #2e7d32);
        font-size: 2.5rem;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .page-header p {
        color: #666;
        font-size: 1.1rem;
      }

      .form-section {
        margin-bottom: 40px;
      }

      .form-section h2 {
        color: var(--primary-color, #2e7d32);
        font-size: 1.5rem;
        margin-bottom: 20px;
        border-bottom: 2px solid #e8f5e8;
        padding-bottom: 10px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group.full-width {
        grid-column: 1 / -1;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--primary-color, #2e7d32);
        font-size: 1rem;
      }

      input[type="text"],
      input[type="date"],
      input[type="number"],
      select,
      textarea {
        width: 100%;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        font-family: inherit;
        transition: all 0.3s ease;
        background: #fafafa;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary-color, #2e7d32);
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        background: #fff;
      }

      .btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(45deg, var(--primary-color, #2e7d32), var(--secondary-color, #66bb6a));
        color: #fff;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        font-size: 18px;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(46, 125, 50, 0.3);
      }

      .btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .success-message {
        background: #d4edda;
        color: #155724;
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
        text-align: center;
        font-weight: 600;
        display: none;
        border: 2px solid #c3e6cb;
      }

      

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 30px 20px;
        }

        .form-row {
          grid-template-columns: 1fr;
          gap: 15px;
        }

        .page-header h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <h1>توثيق المؤهلات والمعلومات الشخصية</h1>
        <p>يرجى إدخال معلوماتك ومؤهلاتك لإكمال ملفك الشخصي</p>
      </div>

      <form id="qualification-form">
        <!-- Personal Information Section -->
        <div class="form-section">
          <h2>المعلومات الشخصية</h2>
          <div class="form-row">
            <div class="form-group">
              <label>العمر:</label>
              <input type="number" name="age" min="16" max="100" required />
            </div>
            <div class="form-group">
              <label>المنطقة:</label>
              <select name="region" required>
                <option value="">اختر المنطقة</option>
                <option value="الرياض">الرياض</option>
                <option value="جدة">جدة</option>
                <option value="الدمام">الدمام</option>
                <option value="مكة المكرمة">مكة المكرمة</option>
                <option value="المدينة المنورة">المدينة المنورة</option>
                <option value="الطائف">الطائف</option>
                <option value="تبوك">تبوك</option>
                <option value="بريدة">بريدة</option>
                <option value="خميس مشيط">خميس مشيط</option>
                <option value="الهفوف">الهفوف</option>
                <option value="حفر الباطن">حفر الباطن</option>
                <option value="الجبيل">الجبيل</option>
                <option value="نجران">نجران</option>
                <option value="الباحة">الباحة</option>
                <option value="عرعر">عرعر</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Educational Information Section -->
        <div class="form-section">
          <h2>المعلومات التعليمية والمهنية</h2>
          <div class="form-row">
            <div class="form-group">
              <label>المرحلة التعليمية:</label>
              <select name="education" required>
                <option value="">اختر المرحلة</option>
                <option value="ثانوي">ثانوي</option>
                <option value="دبلوم">دبلوم</option>
                <option value="بكالوريوس">بكالوريوس</option>
                <option value="ماجستير">ماجستير</option>
                <option value="دكتوراه">دكتوراه</option>
                <option value="أخرى">أخرى</option>
              </select>
            </div>
            <div class="form-group">
              <label>التخصص (اختياري):</label>
              <input type="text" name="specialization" placeholder="مثال: هندسة حاسوب، طب، إدارة أعمال" />
            </div>
          </div>
          <div class="form-group full-width">
            <label>الوظيفة الحالية (اختياري):</label>
            <input type="text" name="currentJob" placeholder="مثال: مهندس، طالب، ربة منزل" />
          </div>
        </div>

        <!-- Qualification Information Section -->
        <div class="form-section">
          <h2>المؤهلات والشهادات</h2>
          <div class="form-row">
            <div class="form-group">
              <label>العنوان:</label>
              <input type="text" name="title" required placeholder="مثال: دورة الإسعافات الأولية" />
            </div>
            <div class="form-group">
              <label>الجهة المصدرة:</label>
              <input type="text" name="issuer" required placeholder="مثال: الهلال الأحمر السعودي" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>تاريخ الإصدار:</label>
              <input type="date" name="date" required />
            </div>
            <div class="form-group">
              <label>هل سبق لك التطوع؟</label>
              <select name="volunteered" required>
                <option value="">اختر</option>
                <option value="نعم">نعم</option>
                <option value="لا">لا</option>
              </select>
            </div>
          </div>
        </div>

        

        <button type="submit" class="btn" id="submitBtn">
          حفظ المعلومات والانتقال للفرص التطوعية
        </button>
      </form>

      <div class="success-message" id="success-message">
        ✅ تم حفظ معلوماتك بنجاح!
      </div>

      <div class="loading" id="loading">
        <div>جاري الحفظ...</div>
      </div>

      
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyALzVz48KJE596dLl7xXZbpfLsxDEHhLF0",
        authDomain: "mumkin-d4855.firebaseapp.com",
        projectId: "mumkin-d4855",
        storageBucket: "mumkin-d4855.firebasestorage.app",
        messagingSenderId: "910506834639",
        appId: "1:910506834639:web:f4955bb2979fbe21ad15ba",
        measurementId: "G-3ESCTR48BG",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth();
      const db = getFirestore();

      let currentUser;

      const form = document.getElementById("qualification-form");
      const message = document.getElementById("success-message");
      const loading = document.getElementById("loading");
      const submitBtn = document.getElementById("submitBtn");
      onAuthStateChanged(auth, (user) => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        currentUser = user;
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!currentUser) {
          alert("خطأ: لم يتم تسجيل الدخول");
          return;
        }

        // Get form data
        const formData = new FormData(form);
        const userData = {
          age: parseInt(formData.get('age')),
          region: formData.get('region').trim(),
          education: formData.get('education'),
          specialization: formData.get('specialization').trim(),
          currentJob: formData.get('currentJob').trim(),
          qualification: {
            title: formData.get('title').trim(),
            issuer: formData.get('issuer').trim(),
            date: formData.get('date'),
          },
          volunteered: formData.get('volunteered'),
          profileComplete: true,
          updatedAt: serverTimestamp()
        };

        // Validation
        const requiredFields = ['age', 'region', 'education', 'qualification.title', 'qualification.issuer', 'qualification.date', 'volunteered'];
        const missingFields = requiredFields.filter(field => {
          if (field.includes('.')) {
            const [parent, child] = field.split('.');
            return !userData[parent] || !userData[parent][child];
          }
          return !userData[field];
        });

        if (missingFields.length > 0) {
          alert("يرجى ملء جميع الحقول المطلوبة");
          return;
        }

        // Show loading
        loading.style.display = 'block';
        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الحفظ...';

        try {
          // Save to Firestore
          await setDoc(doc(db, "users", currentUser.uid), userData, { merge: true });

          // Show success message
          message.style.display = 'block';
          form.reset();

          // Redirect to opportunities page
          setTimeout(() => {
            window.location.href = "opportunities.html";
          }, 2000);

        } catch (error) {
          console.error("Error saving data:", error);
          alert("حدث خطأ أثناء حفظ البيانات: " + error.message);
        } finally {
          loading.style.display = 'none';
          submitBtn.disabled = false;
          submitBtn.textContent = 'حفظ المعلومات والانتقال للفرص التطوعية';
        }
      });

      

      console.log('🚀 صفحة توثيق المؤهلات جاهزة');
    </script>
  </body>
</html>
