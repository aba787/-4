<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل حساب - منصة مُمكّن</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fdf9 0%, #e8f5e8 100%);
      font-family: 'Cairo', sans-serif;
      padding: 20px;
    }
    .register-container {
      max-width: 600px;
      width: 100%;
      background: var(--white);
      padding: 40px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-top: 20px;
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 30px;
      font-size: 2rem;
      font-weight: 700;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-dark);
      font-size: 1rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      transition: var(--transition);
      background: #fafafa;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
      background: var(--white);
    }
    .form-group input.valid {
      border-color: var(--secondary-color);
    }
    .form-group input.invalid {
      border-color: #f44336;
    }
    .password-container {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: var(--text-light);
      transition: var(--transition);
    }
    .toggle-password:hover {
      color: var(--primary-color);
    }
    .password-strength {
      font-size: 0.85rem;
      margin-top: 5px;
      padding: 5px;
      border-radius: 4px;
      display: none;
    }
    .password-strength.weak {
      color: #f44336;
      background: #ffebee;
    }
    .password-strength.medium {
      color: #ff9800;
      background: #fff3e0;
    }
    .password-strength.strong {
      color: #4caf50;
      background: #e8f5e9;
    }
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: var(--transition);
    }
    .btn-submit:hover::before {
      left: 100%;
    }
    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(46, 125, 50, 0.3);
    }
    .error, .success {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
    }
    .error {
      color: #f44336;
      background: #ffebee;
      border: 1px solid #ffcdd2;
    }
    .success {
      color: #2e7d32;
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
    }
    .links {
      text-align: center;
      margin-top: 25px;
    }
    .links p {
      margin: 10px 0;
    }
    .links a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .links a:hover {
      text-decoration: underline;
      color: var(--secondary-color);
    }
    .loading-spinner {
      display: none;
      margin-left: 10px;
    }
    .field-hint {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 5px;
    }
    .required {
      color: #f44336;
    }

    .btn.btn-secondary { /* Added for the send code button */
      padding: 12px 20px;
      white-space: nowrap;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn.btn-secondary:hover {
      background-color: #388e3c;
    }


    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .register-container {
        padding: 30px 25px;
        margin: 10px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
      }
      .register-container {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>إنشاء حساب جديد</h1>
    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label>الاسم الأول <span class="required">*</span></label>
          <input type="text" id="firstName" required placeholder="أدخل اسمك الأول" />
        </div>
        <div class="form-group">
          <label>الاسم الأخير <span class="required">*</span></label>
          <input type="text" id="lastName" required placeholder="أدخل اسمك الأخير" />
        </div>
      </div>

      <div class="form-group">
          <label>البريد الإلكتروني <span class="required">*</span></label>
          <input type="email" id="email" required placeholder="example@email.com" />
          <div class="field-hint">سيتم استخدام البريد الإلكتروني لتسجيل الدخول</div>
        </div>

        <div class="form-group" id="emailVerificationGroup" style="display: none;">
          <label>رمز التحقق للبريد الإلكتروني <span class="required">*</span></label>
          <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="emailVerificationCode" placeholder="أدخل الرمز المرسل" maxlength="6" style="flex: 1;" />
            <button type="button" id="sendEmailCode" class="btn btn-secondary">إرسال رمز</button>
          </div>
          <div class="field-hint">تحقق من بريدك الإلكتروني</div>
        </div>

      <div class="form-row">
        <div class="form-group">
          <label>رقم الهاتف <span class="required">*</span></label>
          <input type="tel" id="phone" pattern="^05\d{8}$" placeholder="05XXXXXXXX" required />
          <div class="field-hint">رقم هاتف سعودي يبدأ بـ 05</div>
        </div>
        <div class="form-group">
          <label>العمر</label>
          <input type="number" id="age" min="16" max="80" placeholder="العمر" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>المنطقة <span class="required">*</span></label>
          <select id="region" required>
            <option value="">اختر المنطقة</option>
            <option value="الرياض">الرياض</option>
            <option value="مكة المكرمة">مكة المكرمة</option>
            <option value="المدينة المنورة">المدينة المنورة</option>
            <option value="المنطقة الشرقية">المنطقة الشرقية</option>
            <option value="عسير">عسير</option>
            <option value="تبوك">تبوك</option>
            <option value="حائل">حائل</option>
            <option value="الحدود الشمالية">الحدود الشمالية</option>
            <option value="جازان">جازان</option>
            <option value="نجران">نجران</option>
            <option value="الباحة">الباحة</option>
            <option value="الجوف">الجوف</option>
            <option value="القصيم">القصيم</option>
          </select>
        </div>
        <div class="form-group">
          <label>الجنس <span class="required">*</span></label>
          <select id="gender" required>
            <option value="">اختر الجنس</option>
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>كلمة المرور <span class="required">*</span></label>
          <div class="password-container">
            <input type="password" id="password" required minlength="6" placeholder="أدخل كلمة مرور قوية" />
            <span id="togglePassword" class="toggle-password">👁️</span>
          </div>
          <div id="passwordStrength" class="password-strength"></div>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور <span class="required">*</span></label>
          <div class="password-container">
            <input type="password" id="confirmPassword" required minlength="6" placeholder="أعد إدخال كلمة المرور" />
            <span id="toggleConfirmPassword" class="toggle-password">👁️</span>
          </div>
        </div>
      </div>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <button type="submit" id="submitBtn" class="btn-submit">
        إنشاء الحساب
        <div class="loading-spinner" id="loadingSpinner">
          <div class="loading"></div>
        </div>
      </button>
    </form>

    <div class="links">
      <p><a href="login.html">لديك حساب؟ سجل دخولك</a></p>
      <p><a href="register-association.html">تسجيل جمعية خيرية</a></p>
      <p><a href="index.html">العودة للرئيسية</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile, EmailAuthProvider, reauthenticateWithCredential, signInWithCredential } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Dummy Firebase Config - Replace with your actual config
    const firebaseConfig = {
      apiKey: "AIzaSyALzVz48KJE596dLl7xXZbpfLsxDEHhLF0",
      authDomain: "mumkin-d4855.firebaseapp.com",
      projectId: "mumkin-d4855",
      storageBucket: "mumkin-d4855.firebasestorage.app",
      messagingSenderId: "910506834639",
      appId: "1:910506834639:web:f4955bb2979fbe21ad15ba",
      measurementId: "G-3ESCTR48BG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- State variables ---
    let verificationId = null;
    let isEmailVerified = false;

    // --- DOM Elements ---
    const form = document.getElementById("registerForm");
    const errorDiv = document.getElementById("error");
    const successDiv = document.getElementById("success");
    const submitBtn = document.getElementById("submitBtn");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const togglePassword = document.getElementById("togglePassword");
    const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
    const passwordStrength = document.getElementById("passwordStrength");

    // Email verification elements
    const emailInput = document.getElementById("email");
    const emailVerificationGroup = document.getElementById("emailVerificationGroup");
    const emailVerificationCodeInput = document.getElementById("emailVerificationCode");
    const sendEmailCodeBtn = document.getElementById("sendEmailCode");

    // --- Event Listeners ---

    // Toggle password visibility
    togglePassword.addEventListener("click", () => {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      togglePassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    toggleConfirmPassword.addEventListener("click", () => {
      const type = confirmPasswordInput.type === "password" ? "text" : "password";
      confirmPasswordInput.type = type;
      toggleConfirmPassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    // Password strength checker
    passwordInput.addEventListener("input", () => {
      const password = passwordInput.value;
      const strength = checkPasswordStrength(password);

      passwordStrength.style.display = password ? 'block' : 'none';
      passwordStrength.className = `password-strength ${strength.level}`;
      passwordStrength.textContent = strength.message;
    });

    // Real-time validation for input fields
    document.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select').forEach(input => {
      input.addEventListener('blur', validateField);
      input.addEventListener('input', validateField);
    });

    // Email input change: show/hide verification if email is valid
    emailInput.addEventListener('input', () => {
      validateField({ target: emailInput });
      if (validateEmail(emailInput.value)) {
        emailVerificationGroup.style.display = "block";
        sendEmailCodeBtn.disabled = false;
        isEmailVerified = false; // Reset verification status on email change
      } else {
        emailVerificationGroup.style.display = "none";
        isEmailVerified = false;
      }
    });

    // Send email verification code
    sendEmailCodeBtn.addEventListener("click", async () => {
      const email = emailInput.value;
      if (!validateEmail(email)) {
        showError("يرجى إدخال بريد إلكتروني صحيح أولاً.");
        return;
      }

      sendEmailCodeBtn.disabled = true;
      sendEmailCodeBtn.textContent = "جاري الإرسال...";

      try {
        // In a real application, you would send the code using a backend service or Firebase Functions.
        // For this example, we'll simulate sending a code and assume success.
        // You would typically use something like:
        // await sendEmailVerification(auth.currentUser, { url: 'YOUR_CONTINUE_URL' });
        // Or with custom tokens/verification codes if your backend handles it.

        // Simulate code generation and sending
        const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
        console.log(`Simulated verification code for ${email}: ${generatedCode}`);
        // Store the code temporarily (e.g., in localStorage or a variable) for verification
        sessionStorage.setItem('emailVerificationCode', generatedCode);

        showSuccess("تم إرسال رمز التحقق إلى بريدك الإلكتروني. يرجى التحقق.");
        emailVerificationCodeInput.value = ''; // Clear previous code
        emailVerificationCodeInput.focus();
        emailVerificationGroup.style.display = "block"; // Ensure it's visible
        sendEmailCodeBtn.textContent = "إعادة إرسال الرمز"; // Change button text
        sendEmailCodeBtn.disabled = false; // Re-enable after a delay or manual click
      } catch (error) {
        console.error("Error sending verification code:", error);
        showError("حدث خطأ أثناء إرسال رمز التحقق. يرجى المحاولة مرة أخرى.");
        sendEmailCodeBtn.textContent = "إرسال رمز";
        sendEmailCodeBtn.disabled = false;
      }
    });

    // Verify email code on input
    emailVerificationCodeInput.addEventListener('input', () => {
      const enteredCode = emailVerificationCodeInput.value;
      const storedCode = sessionStorage.getItem('emailVerificationCode');

      if (enteredCode.length === 6 && enteredCode === storedCode) {
        isEmailVerified = true;
        emailVerificationCodeInput.classList.add('valid');
        emailVerificationCodeInput.classList.remove('invalid');
        successDiv.textContent = "✅ تم التحقق من البريد الإلكتروني بنجاح!";
        successDiv.style.display = "block";
        sendEmailCodeBtn.disabled = true; // Disable sending new codes once verified
      } else if (enteredCode.length > 0) {
        emailVerificationCodeInput.classList.add('invalid');
        emailVerificationCodeInput.classList.remove('valid');
        isEmailVerified = false;
        successDiv.style.display = "none";
      } else {
        emailVerificationCodeInput.classList.remove('valid', 'invalid');
        isEmailVerified = false;
        successDiv.style.display = "none";
      }
    });


    // Form submission handler
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // Reset messages
      errorDiv.style.display = "none";
      successDiv.style.display = "none";

      // Get form data
      const formData = {
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: emailInput.value.trim(),
        phone: document.getElementById("phone").value.trim(),
        age: document.getElementById("age").value,
        region: document.getElementById("region").value,
        gender: document.getElementById("gender").value,
        password: passwordInput.value,
        confirmPassword: confirmPasswordInput.value,
        emailVerificationCode: emailVerificationCodeInput.value.trim()
      };

      // Validate form
      const validation = validateForm(formData);
      if (!validation.isValid) {
        showError(validation.message);
        return;
      }

      // Check if email is verified
      if (!isEmailVerified) {
        showError("يرجى التحقق من بريدك الإلكتروني أولاً.");
        return;
      }

      // Show loading state
      setLoading(true);

      try {
        // Create user account with email and password
        const userCredential = await createUserWithEmailAndPassword(auth, formData.email, formData.password);
        const user = userCredential.user;

        // Update user profile (display name)
        await updateProfile(user, {
          displayName: `${formData.firstName} ${formData.lastName}`
        });

        // Save user data to Firestore
        await setDoc(doc(db, "users", user.uid), {
          firstName: formData.firstName,
          lastName: formData.lastName,
          fullName: `${formData.firstName} ${formData.lastName}`,
          email: formData.email,
          phone: formData.phone,
          age: formData.age ? parseInt(formData.age) : null,
          region: formData.region,
          gender: formData.gender,
          accountType: 'volunteer', // Default type, might need adjustment
          profileComplete: false,
          createdAt: serverTimestamp(),
          lastLogin: serverTimestamp(),
          emailVerified: true // Mark email as verified after successful registration
        });

        showSuccess("✅ تم إنشاء الحساب بنجاح! جاري التوجيه لصفحة توثيق المؤهلات...");

        // Redirect to qualifications page after success
        setTimeout(() => {
          window.location.href = "qualifications.html";
        }, 2000);

      } catch (error) {
        console.error("Registration error:", error);
        setLoading(false);
        handleRegistrationError(error);
      }
    });

    // --- Helper Functions ---

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      loadingSpinner.style.display = isLoading ? 'inline-block' : 'none';
      submitBtn.innerHTML = isLoading ? 'جاري إنشاء الحساب...' : 'إنشاء الحساب';

      if (isLoading) {
        // Ensure spinner is appended only once if it was already there and removed
        if (!submitBtn.querySelector('.loading-spinner')) {
          const spinner = document.createElement('div');
          spinner.className = 'loading-spinner';
          spinner.innerHTML = '<div class="loading"></div>';
          submitBtn.appendChild(spinner);
        }
      } else {
        // Remove spinner if it exists and button text is reset
        const existingSpinner = submitBtn.querySelector('.loading-spinner');
        if (existingSpinner) {
          existingSpinner.remove();
        }
      }
    }

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.style.display = "block";
      successDiv.style.display = "none";
      errorDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showSuccess(message) {
      successDiv.textContent = message;
      successDiv.style.display = "block";
      errorDiv.style.display = "none";
      successDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function validateForm(data) {
      if (!data.firstName || !data.lastName) {
        return { isValid: false, message: "يرجى إدخال الاسم الأول والأخير" };
      }

      if (!validateEmail(data.email)) {
        return { isValid: false, message: "يرجى إدخال بريد إلكتروني صحيح" };
      }

      // Only validate phone if it's not empty, as it might not be mandatory based on requirements
      if (data.phone && !validateSaudiPhone(data.phone)) {
        return { isValid: false, message: "يرجى إدخال رقم هاتف سعودي صحيح (05XXXXXXXX)" };
      }

      if (!data.region || !data.gender) {
        return { isValid: false, message: "يرجى اختيار المنطقة والجنس" };
      }

      if (data.password.length < 6) {
        return { isValid: false, message: "كلمة المرور يجب أن تكون 6 أحرف على الأقل" };
      }

      if (data.password !== data.confirmPassword) {
        return { isValid: false, message: "كلمات المرور غير متطابقة" };
      }

      // Check email verification code if it's displayed and required
      if (emailVerificationGroup.style.display !== 'none' && !data.emailVerificationCode) {
        return { isValid: false, message: "يرجى إدخال رمز التحقق المرسل إلى بريدك الإلكتروني" };
      }

      return { isValid: true };
    }

    function validateField(e) {
      const field = e.target;
      const value = field.value.trim();

      // Remove previous validation classes
      field.classList.remove('valid', 'invalid');

      // If field is empty and required, mark as invalid
      if (!value && field.required) {
        field.classList.add('invalid');
        return;
      }

      // Specific validations
      if (field.type === 'email' && value) {
        field.classList.add(validateEmail(value) ? 'valid' : 'invalid');
      }

      if (field.type === 'tel' && value) {
        field.classList.add(validateSaudiPhone(value) ? 'valid' : 'invalid');
      }

      if (field.id === 'confirmPassword' && value) {
        const match = value === passwordInput.value;
        field.classList.add(match ? 'valid' : 'invalid');
      }

      if (field.id === 'emailVerificationCode' && value) {
        const storedCode = sessionStorage.getItem('emailVerificationCode');
        const match = value.length === 6 && value === storedCode;
        field.classList.add(match ? 'valid' : 'invalid');
      }

      // If field has value and is required, mark as valid
      if (value && field.required) {
        field.classList.add('valid');
      }
    }

    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function validateSaudiPhone(phone) {
      const phoneRegex = /^05\d{8}$/;
      return phoneRegex.test(phone);
    }

    function checkPasswordStrength(password) {
      if (password.length < 6) {
        return { level: 'weak', message: 'كلمة المرور ضعيفة - يجب أن تكون 6 أحرف على الأقل' };
      }

      let score = 0;
      if (password.length >= 8) score++;
      if (/[a-z]/.test(password)) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      if (score < 2) {
        return { level: 'weak', message: 'كلمة المرور ضعيفة' };
      } else if (score < 4) {
        return { level: 'medium', message: 'كلمة المرور متوسطة القوة' };
      } else {
        return { level: 'strong', message: 'كلمة المرور قوية' };
      }
    }

    function handleRegistrationError(error) {
      let message;
      switch (error.code) {
        case 'auth/email-already-in-use':
          message = "هذا البريد الإلكتروني مستخدم مسبقاً";
          break;
        case 'auth/invalid-email':
          message = "البريد الإلكتروني غير صحيح";
          break;
        case 'auth/weak-password':
          message = "كلمة المرور ضعيفة جداً";
          break;
        case 'auth/network-request-failed':
          message = "خطأ في الاتصال بالإنترنت";
          break;
        case 'auth/popup-blocked-by-user':
          message = "تم حظر نافذة التحقق من قبل المستخدم.";
          break;
        default:
          message = `حدث خطأ أثناء إنشاء الحساب: ${error.message}`;
      }
      showError(message);
    }

    console.log('🚀 صفحة التسجيل جاهزة');
  </script>
