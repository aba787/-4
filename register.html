<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل حساب - منصة مُمكّن</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      background: #eaf4ec;
      font-family: 'Cairo', sans-serif;
      padding-top: 50px;
    }
    .register-container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #2e7d32; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 16px;
    }
    .btn-submit {
      width: 100%; padding: 12px;
      background-color: #2e7d32; color: white;
      border: none; border-radius: 6px;
      font-size: 16px; cursor: pointer;
      transition: 0.3s ease;
    }
    .btn-submit:disabled { background: #9e9e9e; cursor: not-allowed; }
    .btn-submit:hover:not(:disabled) { background-color: #1b5e20; }
    .error, .success {
      margin-top: 10px; text-align: center; font-size: 14px; display: none;
    }
    .error { color: #f44336; }
    .success { color: #2e7d32; }
    .links { text-align: center; margin-top: 20px; }
    .links a { color: #2e7d32; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .toggle-password {
      position:absolute; left: 15px; top: 50%;
      transform: translateY(-50%); cursor:pointer; font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>إنشاء حساب جديد</h1>
    <form id="registerForm">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="fullName" required />
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label>رقم الهاتف</label>
        <input type="tel" id="phone" pattern="^05\d{8}$" placeholder="مثال: 05XXXXXXXX" required />
      </div>

      <div class="form-group">
        <label>المنطقة</label>
        <select id="region" required>
          <option value="">اختر المنطقة</option>
          <option value="الرياض">الرياض</option>
          <option value="جدة">جدة</option>
          <option value="الدمام">الدمام</option>
          <option value="مكة">مكة</option>
          <option value="المدينة">المدينة</option>
        </select>
      </div>

      <div class="form-group">
        <label>الجنس</label>
        <select id="gender" required>
          <option value="">اختر الجنس</option>
          <option value="ذكر">ذكر</option>
          <option value="أنثى">أنثى</option>
        </select>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" required minlength="6" />
        <span id="togglePassword" class="toggle-password">👁️</span>
      </div>

      <div class="form-group">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" required minlength="6" />
        <span id="toggleConfirmPassword" class="toggle-password">👁️</span>
      </div>


      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <button type="submit" id="submitBtn" 
      class="btn-submit">إنشاء الحساب</button>
    </form>

    <div class="links">
      <p><a href="login.html">لديك حساب؟ سجل دخولك</a></p>
      <p><a href="index.html">العودة للرئيسية</a></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALzVz48KJE596dLl7xXZbpfLsxDEHhLF0",
      authDomain: "mumkin-d4855.firebaseapp.com",
      projectId: "mumkin-d4855",
      storageBucket: "mumkin-d4855.firebasestorage.app",
      messagingSenderId: "910506834639",
      appId: "1:910506834639:web:f4955bb2979fbe21ad15ba",
      measurementId: "G-3ESCTR48BG"
    };

    // Firebase init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // عناصر الفورم
    const form = document.getElementById("registerForm");
    const errorDiv = document.getElementById("error");
    const successDiv = document.getElementById("success");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const togglePassword = document.getElementById("togglePassword");
    const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");

    // إظهار/إخفاء كلمة المرور
    togglePassword.addEventListener("click", () => {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      togglePassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    // إظهار/إخفاء تأكيد كلمة المرور
    toggleConfirmPassword.addEventListener("click", () => {
      const type = confirmPasswordInput.type === "password" ? "text" : "password";
      confirmPasswordInput.type = type;
      toggleConfirmPassword.textContent = type === "password" ? "👁️" : "🙈";
    });

    // تسجيل المستخدم
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.style.display = "none";
      successDiv.style.display = "none";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const region = document.getElementById("region").value;
      const gender = document.getElementById("gender").value;
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // تحقق من كلمة المرور
      if (password !== confirmPassword) {
        errorDiv.textContent = "كلمات المرور غير متطابقة";
        errorDiv.style.display = "block";
        return;
      }

      // تحقق من رقم الهاتف السعودي
      if (!/^05\d{8}$/.test(phone)) {
        errorDiv.textContent = "رقم الهاتف غير صحيح (يجب أن يبدأ بـ 05 ويكون 10 أرقام)";
        errorDiv.style.display = "block";
        return;
      }

      // تعطيل زر التسجيل أثناء المعالجة
      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ جاري إنشاء الحساب...";

      try {
        // إنشاء المستخدم
        const cred = await createUserWithEmailAndPassword(auth, email, password);

        // حفظ بيانات المستخدم في Firestore
        await setDoc(doc(db, "users", cred.user.uid), {
          fullName,
          email,
          phone,
          region,
          gender,
          createdAt: serverTimestamp()
        });

        successDiv.textContent = "✅ تم إنشاء الحساب بنجاح!";
        successDiv.style.display = "block";

        // إعادة التوجيه بعد النجاح
        setTimeout(() => {
          window.location.href = "qualifications.html";

          
        }, 1500);

      } catch (err) {
        errorDiv.textContent = "خطأ: " + err.message;
        errorDiv.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "إنشاء الحساب";
      }
    });
  </script>

</body>
</html>
