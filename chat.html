<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الشات - الأدمن</title>
<style>
body {
  font-family:'Cairo', sans-serif;
  background:#f9f9f9;
  margin:0;
  display:flex;
  height:100vh;
}
.sidebar {
  width:30%;
  background:#fff;
  overflow-y:auto;
  border-left:1px solid #ddd;
}
.sidebar h3 {
  padding:15px;
  margin:0;
  background:#008080;
  color:white;
}
.user-list {
  list-style:none;
  padding:0;
  margin:0;
}
.user-list li {
  padding:10px 15px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.user-list li:hover { background:#f0f0f0; }

.chat-area {
  flex:1;
  display:flex;
  flex-direction:column;
  padding-bottom:70px; /* مساحة إضافية للـ bottom-nav */
}
.chat-box {
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:#fff;
  border-bottom:1px solid #ccc;
}
.chat-message {
  margin:5px 0;
  padding:10px;
  border-radius:10px;
  max-width:80%;
  word-wrap:break-word;
}
.chat-message.me { background:#d1f7d6; align-self:flex-end; }
.chat-message.other { background:#f1f1f1; align-self:flex-start; }

.input-area {
  display:flex;
  padding:10px;
  background:#fff;
  border-top:1px solid #ccc;
  position:fixed;
  bottom:50px; /* فوق الـ bottom-nav */
  right:30%; /* يوازي عرض الـ chat-area */
  left:0;
  z-index:10;
}
.input-area input {
  flex:1;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
}
.input-area button {
  margin-right:10px;
  padding:10px 20px;
  background:#008080;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.bottom-nav {
  position:fixed;
  bottom:0;
  right:0;
  left:0;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  z-index:5;
}
.bottom-nav a {
  text-decoration:none;
  color:#888;
  font-size:24px;
  transition:color 0.2s;
}
.bottom-nav a:hover { color:#000; }
.bottom-nav a.active { color:#2196f3; font-weight:bold; }
</style>
</head>
<body>

<div class="sidebar">
  <h3>المستخدمين</h3>
  <ul class="user-list" id="userList"></ul>
</div>

<div class="chat-area">
  <div class="chat-box" id="chatBox"></div>
  <div class="input-area">
    <input type="text" id="adminMsgInput" placeholder="اكتب ردك هنا..." />
    <button id="adminSendBtn">إرسال</button>
  </div>
</div>

<footer class="bottom-nav">
  <a href="opportunities.html">🏠</a>
  <a href="favorites.html">❤️</a>
  <a href="chat.html" class="active">💬</a>
  <a href="my-requests.html">📝</a>
  <a href="edit-profile.html">👤</a>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collectionGroup,
  getDocs,
  collection,
  query,
  orderBy,
  onSnapshot,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlMibtDbLAZLMhhJNho5Sih_qBfWxZyXI",
  authDomain: "momaken-45ba9.firebaseapp.com",
  projectId: "momaken-45ba9",
  storageBucket: "momaken-45ba9.appspot.com",
  messagingSenderId: "638133555280",
  appId: "1:638133555280:web:c84bd87c15cabe55d30155"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const userList = document.getElementById("userList");
const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("adminMsgInput");
const sendBtn = document.getElementById("adminSendBtn");

let selectedUserId = null;

// جلب المستخدمين الذين لديهم محادثات
async function fetchUsers() {
  const snapshot = await getDocs(collectionGroup(db, "messages"));
  const userIds = new Set();
  snapshot.forEach(doc => {
    const path = doc.ref.path.split("/");
    const userId = path[1];
    userIds.add(userId);
  });

  userList.innerHTML = "";
  userIds.forEach(uid => {
    const li = document.createElement("li");
    li.textContent = uid;
    li.onclick = () => loadChatWith(uid);
    userList.appendChild(li);
  });
}

// تحميل المحادثة مع المستخدم المحدد
function loadChatWith(userId) {
  selectedUserId = userId;
  const convRef = collection(db, `conversations/${userId}/messages`);
  const q = query(convRef, orderBy("createdAt"));

  onSnapshot(q, snapshot => {
    chatBox.innerHTML = "";
    snapshot.forEach(docSnap => {
      const msg = docSnap.data();
      const div = document.createElement("div");
      div.className = "chat-message " + (msg.uid === "admin" ? "me" : "other");
      div.textContent = msg.text;
      chatBox.appendChild(div);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

// إرسال رسالة
sendBtn.addEventListener("click", async () => {
  if (!selectedUserId) return alert("اختر مستخدم أولاً");
  const text = msgInput.value.trim();
  if (!text) return;
  await addDoc(collection(db, `conversations/${selectedUserId}/messages`), {
    text,
    uid: "admin",
    createdAt: serverTimestamp()
  });
  msgInput.value = "";
});

fetchUsers();
</script>

</body>
</html>
