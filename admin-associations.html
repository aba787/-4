
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة طلبات المنشآت - لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #f8fdf9 0%, #e8f5e8 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      background: var(--white);
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }
    .header h1 {
      color: var(--primary-color);
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--white);
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-color);
    }
    .request-card {
      background: var(--white);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 25px;
      margin-bottom: 20px;
      border-left: 5px solid var(--secondary-color);
    }
    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .request-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-dark);
    }
    .request-status {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .status-pending {
      background: #fff3cd;
      color: #856404;
    }
    .status-approved {
      background: #d4edda;
      color: #155724;
    }
    .status-rejected {
      background: #f8d7da;
      color: #721c24;
    }
    .request-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .detail-item {
      display: flex;
      align-items: center;
    }
    .detail-label {
      font-weight: 600;
      color: var(--text-dark);
      min-width: 80px;
    }
    .detail-value {
      color: var(--text-light);
    }
    .request-description {
      background: var(--light-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .request-actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-approve {
      background: #28a745;
      color: white;
    }
    .btn-approve:hover {
      background: #218838;
      transform: translateY(-1px);
    }
    .btn-reject {
      background: #dc3545;
      color: white;
    }
    .btn-reject:hover {
      background: #c82333;
      transform: translateY(-1px);
    }
    .btn-view {
      background: var(--primary-color);
      color: white;
    }
    .btn-view:hover {
      background: var(--secondary-color);
      transform: translateY(-1px);
    }
    .no-requests {
      text-align: center;
      padding: 40px;
      color: var(--text-light);
      background: var(--white);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .filters {
      background: var(--white);
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filters select {
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
    }
    @media (max-width: 768px) {
      .request-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .request-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- Header -->
    <div class="header">
      <h1>إدارة طلبات المنشآت</h1>
      <p>مراجعة وقبول/رفض طلبات تسجيل المنشآت الخيرية</p>
    </div>

    <!-- Statistics -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="totalRequests">0</div>
        <div>إجمالي الطلبات</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="pendingRequests">0</div>
        <div>قيد المراجعة</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">متعدد</div>
        <div>تم القبول</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">قليل</div>
        <div>تم الرفض</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <label>فلترة حسب الحالة:</label>
      <select id="statusFilter">
        <option value="all">جميع الطلبات</option>
        <option value="pending">قيد المراجعة</option>
        <option value="approved">تم القبول</option>
        <option value="rejected">تم الرفض</option>
      </select>

      <label>فلترة حسب المنطقة:</label>
      <select id="regionFilter">
        <option value="all">جميع المناطق</option>
        <option value="الرياض">الرياض</option>
        <option value="جدة">جدة</option>
        <option value="مكة">مكة المكرمة</option>
        <option value="المدينة">المدينة المنورة</option>
        <option value="الشرقية">المنطقة الشرقية</option>
      </select>
    </div>

    <!-- Requests List -->
    <div id="requestsList" class="loading">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      doc, 
      updateDoc, 
      setDoc,
      addDoc,
      serverTimestamp,
      query,
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let allRequests = [];

    // Load requests when page loads
    window.addEventListener('load', loadRequests);

    // Filter listeners
    document.getElementById('statusFilter').addEventListener('change', filterRequests);
    document.getElementById('regionFilter').addEventListener('change', filterRequests);

    async function loadRequests() {
      try {
        const q = query(collection(db, "registrationRequests"), orderBy("submittedAt", "desc"));
        const snapshot = await getDocs(q);
        
        allRequests = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

        updateStatistics();
        displayRequests(allRequests);
        
      } catch (error) {
        console.error("Error loading requests:", error);
        document.getElementById('requestsList').innerHTML = 
          '<div class="no-requests">حدث خطأ في تحميل الطلبات</div>';
      }
    }

    function updateStatistics() {
      const total = allRequests.length;
      const pending = allRequests.filter(req => req.status === 'pending').length;
      const approved = allRequests.filter(req => req.status === 'approved').length;
      const rejected = allRequests.filter(req => req.status === 'rejected').length;

      document.getElementById('totalRequests').textContent = total;
      document.getElementById('pendingRequests').textContent = pending;
      document.getElementById('approvedRequests').textContent = approved;
      document.getElementById('rejectedRequests').textContent = rejected;
    }

    function filterRequests() {
      const statusFilter = document.getElementById('statusFilter').value;
      const regionFilter = document.getElementById('regionFilter').value;

      let filtered = allRequests;

      if (statusFilter !== 'all') {
        filtered = filtered.filter(req => req.status === statusFilter);
      }

      if (regionFilter !== 'all') {
        filtered = filtered.filter(req => req.region === regionFilter);
      }

      displayRequests(filtered);
    }

    function displayRequests(requests) {
      const container = document.getElementById('requestsList');

      if (requests.length === 0) {
        container.innerHTML = '<div class="no-requests">لا توجد طلبات تتطابق مع الفلاتر المحددة</div>';
        return;
      }

      container.innerHTML = requests.map(req => `
        <div class="request-card">
          <div class="request-header">
            <div class="request-title">${req.name}</div>
            <div class="request-status status-${req.status}">
              ${req.status === 'pending' ? 'قيد المراجعة' : 
                req.status === 'approved' ? 'تم القبول' : 'تم الرفض'}
            </div>
          </div>

          <div class="request-details">
            <div class="detail-item">
              <span class="detail-label">البريد:</span>
              <span class="detail-value">${req.email}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">الهاتف:</span>
              <span class="detail-value">${req.phone}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">المنطقة:</span>
              <span class="detail-value">${req.region}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">المجال:</span>
              <span class="detail-value">${req.field}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">الترخيص:</span>
              <span class="detail-value">${req.license}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">التاريخ:</span>
              <span class="detail-value">${req.submittedAt?.toDate?.()?.toLocaleDateString('ar-SA') || 'غير محدد'}</span>
            </div>
          </div>

          <div class="request-description">
            <strong>وصف الجمعية:</strong><br>
            ${req.description}
          </div>

          <div class="request-actions">
            ${req.status === 'pending' ? `
              <button class="btn btn-approve" onclick="approveRequest('${req.id}', '${req.email}', '${req.password}', '${req.name}')">
                ✅ قبول الطلب
              </button>
              <button class="btn btn-reject" onclick="rejectRequest('${req.id}')">
                ❌ رفض الطلب
              </button>
            ` : ''}
            <button class="btn btn-view" onclick="viewDetails('${req.id}')">
              👁️ عرض التفاصيل
            </button>
          </div>
        </div>
      `).join('');
    }

    // Global functions for button actions
    window.approveRequest = async (requestId, email, password, name) => {
      if (!confirm('هل أنت متأكد من قبول هذا الطلب؟')) return;

      try {
        // Create user account
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Get request data
        const request = allRequests.find(req => req.id === requestId);

        // Create association profile
        await setDoc(doc(db, "associations", user.uid), {
          name: request.name,
          email: request.email,
          phone: request.phone,
          region: request.region,
          field: request.field,
          license: request.license,
          description: request.description,
          status: 'active',
          approvedAt: serverTimestamp(),
          createdAt: serverTimestamp()
        });

        // Update request status
        await updateDoc(doc(db, "registrationRequests", requestId), {
          status: 'approved',
          approvedAt: serverTimestamp(),
          associationId: user.uid
        });

        // Send notification to association
        await addDoc(collection(db, "notifications"), {
          type: 'association_notification',
          title: 'تم قبول طلب التسجيل',
          message: `مرحباً بكم! تم قبول طلب تسجيل الجمعية وإنشاء حسابكم بنجاح. يمكنكم الآن تسجيل الدخول وإدارة الفرص التطوعية.`,
          email: email,
          isRead: false,
          createdAt: serverTimestamp()
        });

        alert('تم قبول الطلب وإنشاء حساب الجمعية بنجاح!');
        loadRequests(); // Refresh the list

      } catch (error) {
        console.error("Error approving request:", error);
        alert('حدث خطأ أثناء قبول الطلب: ' + error.message);
      }
    };

    window.rejectRequest = async (requestId) => {
      const reason = prompt('اكتب سبب الرفض (اختياري):');
      if (!confirm('هل أنت متأكد من رفض هذا الطلب؟')) return;

      try {
        await updateDoc(doc(db, "registrationRequests", requestId), {
          status: 'rejected',
          rejectedAt: serverTimestamp(),
          rejectionReason: reason || 'لم يتم تحديد السبب'
        });

        // Get request data for notification
        const request = allRequests.find(req => req.id === requestId);

        // Send notification
        await addDoc(collection(db, "notifications"), {
          type: 'association_notification', 
          title: 'تم رفض طلب التسجيل',
          message: `نعتذر، تم رفض طلب تسجيل الجمعية. ${reason ? 'السبب: ' + reason : 'يمكنكم التواصل معنا لمزيد من المعلومات.'}`,
          email: request.email,
          isRead: false,
          createdAt: serverTimestamp()
        });

        alert('تم رفض الطلب');
        loadRequests(); // Refresh the list

      } catch (error) {
        console.error("Error rejecting request:", error);
        alert('حدث خطأ أثناء رفض الطلب');
      }
    };

    window.viewDetails = (requestId) => {
      const request = allRequests.find(req => req.id === requestId);
      if (!request) return;

      alert(`
تفاصيل الطلب:
الاسم: ${request.name}
البريد: ${request.email}
الهاتف: ${request.phone}
المنطقة: ${request.region}
المجال: ${request.field}
الترخيص: ${request.license}
الوصف: ${request.description}
تاريخ التقديم: ${request.submittedAt?.toDate?.()?.toLocaleDateString('ar-SA') || 'غير محدد'}
الحالة: ${request.status === 'pending' ? 'قيد المراجعة' : 
          request.status === 'approved' ? 'تم القبول' : 'تم الرفض'}
      `);
    };

    console.log('صفحة إدارة طلبات الجمعيات جاهزة');
  </script>
</body>
</html>
