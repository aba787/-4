<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - منصة مُمكّن</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f8fdf9 0%, #e8f5e8 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .auth-card {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    .auth-card h2 {
      color: #2e7d32; /* Primary color equivalent */
      margin-bottom: 10px;
      font-size: 2rem;
      font-weight: 700;
    }
    .auth-card p {
      color: #757575; /* Text light equivalent */
      margin-bottom: 30px;
      font-size: 1rem;
    }
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }
    .input-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s, box-shadow 0.3s;
      background: #fafafa;
    }
    .input-group input:focus {
      outline: none;
      border-color: #2e7d32; /* Primary color */
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
      background: white;
    }
    .message {
      margin-top: 15px;
      display: none; /* Initially hidden */
      padding: 12px;
      border-radius: 8px;
      font-weight: 500;
      text-align: center;
    }
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: linear-gradient(45deg, #2e7d32, #66bb6a); /* Primary to secondary gradient */
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(46, 125, 50, 0.3);
    }
    .links {
      text-align: center;
      margin-top: 25px;
    }
    .links p {
      margin: 10px 0;
    }
    .links a {
      color: #2e7d32; /* Primary color */
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .links a:hover {
      color: #66bb6a; /* Secondary color */
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 30px 25px;
        margin: 10px;
      }
      .auth-card h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>مرحباً بعودتك</h2>
      <p>سجل دخولك لمتابعة رحلتك التطوعية</p>

      <form id="loginForm">
        <div class="input-group">
          <input type="email" id="email" required placeholder="البريد الإلكتروني" />
        </div>

        <div class="input-group">
          <input type="password" id="password" required placeholder="كلمة المرور" />
        </div>

        <div class="input-group" id="verificationGroup" style="display: none;">
          <input type="text" id="verificationCode" placeholder="رمز التحقق (تم إرساله لبريدك)" maxlength="6" />
          <small style="color: var(--text-light); margin-top: 5px; display: block;">
            تحقق من بريدك الإلكتروني أو رسائل الهاتف
          </small>
        </div>

        <div class="message" id="message"></div>

        <button type="submit" class="btn-submit" id="loginBtn">تسجيل الدخول</button>
        <button type="button" class="btn-submit" id="verifyBtn" style="display: none; background: var(--secondary-color);">تأكيد الدخول</button>
      </form>

      <div class="links">
        <p><a href="register.html">ليس لديك حساب؟ سجل الآن</a></p>
        <p><a href="index.html">العودة للرئيسية</a></p>
      </div>
    </div>
  </div>

  <script>
    let verificationSent = false;
    let generatedCode = '';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');

      // Simple validation
      if (!email || !password) {
        messageDiv.innerHTML = '<p style="color: red;">يرجى ملء جميع الحقول</p>';
        messageDiv.style.display = 'block';
        return;
      }

      if (!verificationSent) {
        // Send verification code
        generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
        
        // Show verification step
        document.getElementById('verificationGroup').style.display = 'block';
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('verifyBtn').style.display = 'block';
        
        messageDiv.innerHTML = '<p style="color: blue;">تم إرسال رمز التحقق إلى بريدك الإلكتروني: ' + generatedCode + '</p>';
        messageDiv.style.display = 'block';
        verificationSent = true;
      }
    });

    document.getElementById('verifyBtn').addEventListener('click', function() {
      const enteredCode = document.getElementById('verificationCode').value;
      const messageDiv = document.getElementById('message');
      const email = document.getElementById('email').value;

      if (!enteredCode) {
        messageDiv.innerHTML = '<p style="color: red;">يرجى إدخال رمز التحقق</p>';
        messageDiv.style.display = 'block';
        return;
      }

      if (enteredCode === generatedCode) {
        localStorage.setItem('currentUser', email.split('@')[0]);
        messageDiv.innerHTML = '<p style="color: green;">✅ تم التحقق بنجاح! جاري التوجيه...</p>';
        messageDiv.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'volunteer-dashboard.html';
        }, 1000);
      } else {
        messageDiv.innerHTML = '<p style="color: red;">❌ رمز التحقق غير صحيح</p>';
        messageDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
